services:
  - type: web
    name: modelo-mundell-fleming-colombia
    runtime: python
    plan: free
    # Render lee la version de Python de PYTHON_VERSION (no de runtime.txt).
    # runtime.txt queda para Streamlit Community Cloud (opcion secundaria).
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    autoDeploy: true
